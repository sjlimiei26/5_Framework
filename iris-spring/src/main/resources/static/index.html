<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>붓꽃 분류</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin: 8px 0; }
    input { width: 80px; margin-left: 8px; }
    button { margin-top: 12px; padding: 8px 16px; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>붓꽃 품종 예측</h1>

  <label>꽃받침 길이 <input id="sepal_length" type="number" step="0.1" value="5.1"></label>
  <label>꽃받침 너비 <input id="sepal_width" type="number" step="0.1" value="3.5"></label>
  <label>꽃잎 길이 <input id="petal_length" type="number" step="0.1" value="1.4"></label>
  <label>꽃잎 너비 <input id="petal_width" type="number" step="0.1" value="0.2"></label>

  <button id="btn">예측하기</button>
  <pre id="result">결과가 여기에 표시됩니다.</pre>

  <script>
    const ids = ["sepal_length", "sepal_width", "petal_length", "petal_width"];

    document.getElementById("btn").addEventListener("click", async () => {
      const out = document.getElementById("result");
      const body = {};
      ids.forEach(id => body[id] = parseFloat(document.getElementById(id).value));

      out.textContent = "요청 중...";
      try {
        const res = await fetch("/api/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
          out.textContent = "오류 (" + res.status + ")\n" + JSON.stringify(data, null, 2);
          return;
        }
        out.textContent =
          "품종: " + data.label + "\n" +
          "확률: " + (data.probability * 100).toFixed(1) + "%\n\n" +
          JSON.stringify(data.probabilities, null, 2);
      } catch (e) {
        out.textContent = "요청 실패: " + e.message;
      }
    });
  </script>
</body>
</html>
