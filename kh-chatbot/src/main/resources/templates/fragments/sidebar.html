<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<body>
    <!-- 공통 사이드바 조각 -->
    <aside th:fragment="sidebar(activeMenu)" class="sidebar">
        <div class="sidebar-header">
            <div class="logo">KH EMS</div>
        </div>
        <nav class="nav-menu">
            <a href="/" class="nav-item" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
                <i class="fas fa-chart-line"></i>
                <span>대시보드</span>
            </a>
            <a href="/employee/list" class="nav-item" th:classappend="${activeMenu == 'employee' ? 'active' : ''}">
                <i class="fas fa-users"></i>
                <span>직원 관리</span>
            </a>
            <a href="/department/list" class="nav-item" th:classappend="${activeMenu == 'department' ? 'active' : ''}">
                <i class="fas fa-building"></i>
                <span>부서 관리</span>
            </a>
            <a href="/job/list" class="nav-item" th:classappend="${activeMenu == 'job' ? 'active' : ''}">
                <i class="fas fa-id-card"></i>
                <span>직급 관리</span>
            </a>
            <a href="/chat" class="nav-item" th:classappend="${activeMenu == 'chat' ? 'active' : ''}">
                <i class="fas fa-robot"></i>
                <span>AI 챗봇</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="contact-info">
                <i class="fas fa-envelope"></i>
                <span>문의하기: sjlim.iei.26@gmail.com</span>
            </div>
        </div>
    </aside>
</body>

</html>
