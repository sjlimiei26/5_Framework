# Spring Boot -> (TCP 5000, JSON Lines) -> Logstash -> Elasticsearch
# 이 파일을 로그 스태시의 config 폴더에 복사한 후 아래 명령어를 실행해주세요. 
# 명령어 실행 (Logstash 폴더에서):
#   bin\logstash.bat -f config\logstash.conf

input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # 숫자 필드가 문자열로 들어오는 경우를 대비해 숫자형으로 변환합니다.
  mutate {
    convert => {
      "http_status" => "integer"
      "duration_ms" => "integer"
    }
  }
}

output {
  # 파이프라인 확인용: 콘솔에 수신한 이벤트를 그대로 출력합니다.
  # 확인이 끝나면 아래 stdout 블록을 지워도 됩니다.
  stdout { codec => rubydebug }

  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "app-log-%{+YYYY.MM.dd}"
    ecs_compatibility => disabled

    # 날짜별 일반 인덱스로 저장하기 위한 설정
    ilm_enabled => false
    # data_stream 옵션이 있는 플러그인(Logstash 7.9 이상)에서만 사용합니다.
    # "알 수 없는 설정" 오류가 나면 이 줄을 지웁니다.
    data_stream => false
  }
}
